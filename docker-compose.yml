services:
  freelance-telegram-bot:
    build: .
    container_name: freelance-telegram-bot
    restart: unless-stopped
    env_file: .env
    environment:
      POLL_SECONDS: 300
    ports:
      - "3000:3000"
    volumes:
      - seen-state:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  seen-state:
